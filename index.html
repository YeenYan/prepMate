<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0b0714" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PrepMate" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>PrepMate</title>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: #0b0714;
      }

      .boot-label {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        color: #f4f1fb;
      }

      .boot-bar {
        width: 120px;
        height: 22px;
        border-radius: 999px;
        color: #a855f7;
        border: 2px solid;
        position: relative;
      }

      .boot-bar::before {
        content: "";
        position: absolute;
        margin: 2px;
        inset: 0 100% 0 0;
        border-radius: inherit;
        background: linear-gradient(120deg, #7c4dff, #a855f7, #d946ef);
        animation: boot-fill 1.5s infinite;
      }

      @keyframes boot-fill {
        100% {
          inset: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-hidden="true">
      <p class="boot-label">Loading PrepMate...</p>
      <div class="boot-bar"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
